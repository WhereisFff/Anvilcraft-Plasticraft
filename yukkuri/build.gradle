plugins {
    id 'java-library'
    id 'maven-publish'
    alias libs.plugins.modDevGradle
}

version = rootProject.yukkuri_version
group = rootProject.maven_group

apply from: rootProject.file('gradle/scripts/repositories.gradle')

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    withSourcesJar()
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = rootProject.parchment_minecraft_version
        mappingsVersion = rootProject.parchment_mappings_version
    }

    mods {
        yukkuri {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    api(libs.anvillib)

    File localAnvilCraftJar = null
    if (rootProject.hasProperty('anvilcraft_jar')) {
        File configured = rootProject.file(rootProject.property('anvilcraft_jar'))
        if (configured.isFile()) localAnvilCraftJar = configured
    } else if (rootProject.findProperty('use_local_anvilcraft')?.toString()?.toBoolean()) {
        File localBuildDir = rootProject.file('../AnvilCraft/build/libs')
        if (localBuildDir.isDirectory()) {
            Set<File> candidates = rootProject.fileTree(localBuildDir) {
                include 'anvilcraft-neoforge-1.21.1-*.jar'
                exclude '*-sources.jar'
            }.files
            if (!candidates.isEmpty()) localAnvilCraftJar = candidates.max { it.lastModified() }
        }
    }

    if (localAnvilCraftJar != null) {
        api(files(localAnvilCraftJar))
    } else {
        api(libs.anvilcraft) { transitive = false }
        interfaceInjectionData(libs.anvilcraft) { transitive = false }
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version_range: rootProject.minecraft_version_range,
        neo_version_range      : rootProject.neo_version_range,
        loader_version_range   : rootProject.loader_version_range,
        yukkuri_version        : project.version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    from rootProject.file('LICENSE')
    manifest.attributes('Automatic-Module-Name': 'dev.anvilcraft.yukkuri')
}

base {
    archivesName = "yukkuri-neoforge-${libs.versions.minecraft.get()}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version
            from components.java
        }
    }

    repositories {
        def mavenUrl = System.getenv('MAVEN_URL')
        if (mavenUrl != null) {
            maven {
                url = mavenUrl
                credentials {
                    username = System.getenv('MAVEN_USERNAME')
                    password = System.getenv('MAVEN_PASSWORD')
                }
            }
        }
    }
}
