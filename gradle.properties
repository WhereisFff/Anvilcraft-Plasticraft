# JVM
java_version=21
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft and NeoForge (the current AnvilCraft 1.21 line)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.219
neo_version_range=[21.1,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=anvilcraftplasticraft
mod_name=Anvilcraft: Plasticraft
mod_license=LGPL-3.0-or-later
mod_version=0.1.0
maven_group=dev.anvilcraft.plasticraft
mod_authors=Anvilcraft Plasticraft contributors
mod_description=An AnvilCraft addon whose first vertical slice is a pushable plastic anvil entity with the vanilla anvil workflow.

# The remote 1.21.1 baseline. A sibling AnvilCraft JAR is opt-in via
# -Puse_local_anvilcraft=true or -Panvilcraft_jar=... (see README.md).
anvilcraft_version=1.6.0+snapshot.2067

systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
