dependencies {
    gameTestImplementation("net.neoforged:testframework:${neo_version}") { transitive = false }

    // AnvilLib 直接用于 Registrum 及其数据提供器。
    api(libs.anvillib)
    interfaceInjectionData(libs.anvillib.recipe)
    interfaceInjectionData(libs.anvillib.moveableEntityBlock)

    // 默认使用已发布的远程快照以保证构建可复现。本地 JAR 必须显式启用，
    // 以免 ../AnvilCraft 中的旧构建在无提示的情况下覆盖远程 HEAD；
    // 如需在 IDEA 中使用刚构建的相邻项目，请指定 -Panvilcraft_jar=...
    //（或 -Puse_local_anvilcraft=true）。
    File localAnvilCraftJar = null
    if (project.hasProperty('anvilcraft_jar')) {
        File configured = project.file(project.property('anvilcraft_jar'))
        if (configured.isFile()) localAnvilCraftJar = configured
    } else if (project.findProperty('use_local_anvilcraft')?.toString()?.toBoolean()) {
        File localBuildDir = project.file('../AnvilCraft/build/libs')
        if (localBuildDir.isDirectory()) {
            Set<File> candidates = project.fileTree(localBuildDir) {
                include 'anvilcraft-neoforge-1.21.1-*.jar'
                exclude '*-sources.jar'
            }.files
            if (!candidates.isEmpty()) localAnvilCraftJar = candidates.max { it.lastModified() }
        }
    }

    if (localAnvilCraftJar != null) {
        logger.lifecycle("Using local AnvilCraft artifact: ${localAnvilCraftJar}")
        implementation(files(localAnvilCraftJar))
        // JAR 是二进制产物，不是接口注入文本文件。
        // 对应的 JSON 在下方的 moddevgradle.gradle 中注册。
    } else {
        implementation(libs.anvilcraft) { transitive = false }
        interfaceInjectionData(libs.anvilcraft) { transitive = false }
    }

    // 可选集成不打入发布的 JAR。Ageratum 通常由本体模组提供，
    // 这些运行时依赖仅用于完善本地客户端的运行环境。
    compileOnly(libs.ageratum)
    compileOnly(libs.jei.common.api)
    compileOnly(libs.jei.forge.api)
    runtimeOnly(libs.jei.forge)
    compileOnly(libs.jade)
    runtimeOnly(libs.jade)
}
