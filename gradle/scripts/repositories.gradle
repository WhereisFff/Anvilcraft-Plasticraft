repositories {
    exclusiveContent {
        forRepositories(
            mavenCentral(),
            maven {
                name = 'Cjsah Maven'
                url = 'https://server.cjsah.net:1002/maven/'
                content {
                    includeGroup 'dev.anvilcraft.lib'
                    includeGroup 'dev.dubhe'
                    includeGroup 'dev.anvilcraft.resource'
                }
            }
        )
        filter {
            includeGroup 'dev.anvilcraft.lib'
            includeGroup 'dev.dubhe'
            includeGroup 'dev.anvilcraft.resource'
        }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = "Jared's Maven"
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }

    // Local Maven is only a fallback for unrelated development artifacts.
    // Keep the AnvilCraft ecosystem remote-first; a sibling AnvilCraft build
    // must be selected explicitly with -Puse_local_anvilcraft=true.
    mavenLocal {
        content {
            excludeGroupByRegex 'dev\\.dubhe(\\..*)?'
            excludeGroupByRegex 'dev\\.anvilcraft(\\..*)?'
        }
    }
}
