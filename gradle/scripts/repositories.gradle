repositories {
    def centralRepository = mavenCentral()
    def anvilRepository = maven {
        name = 'Cjsah Maven'
        url = 'https://server.cjsah.net:1002/maven/'
        content {
            includeGroup 'dev.anvilcraft.lib'
            includeGroup 'dev.dubhe'
            includeGroup 'dev.anvilcraft.resource'
        }
    }

    exclusiveContent {
        forRepositories(
            centralRepository,
            anvilRepository
        )
        filter {
            includeGroup 'dev.anvilcraft.lib'
            includeGroup 'dev.dubhe'
            includeGroup 'dev.anvilcraft.resource'
        }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = "Jared's Maven"
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }

}
