name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate resources
        run: |
          chmod +x gradlew
          ./gradlew runData --no-daemon --console=plain

      - name: Build
        run: ./gradlew build --no-daemon --console=plain

      - name: Resolve artifact name
        id: artifact
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'anvilcraft-plasticraft-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_path"
          echo "name=$(basename "$jar_path" .jar)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            build/libs/${{ steps.artifact.outputs.name }}.jar
            build/libs/${{ steps.artifact.outputs.name }}-sources.jar
          if-no-files-found: error
